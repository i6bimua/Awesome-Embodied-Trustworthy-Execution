<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="690" viewBox="0 0 1600 690">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3f5"/><stop offset="1" stop-color="#ffe3e8"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8e9"/><stop offset="1" stop-color="#ffedc8"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#dceeff"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1600" height="690" rx="28" fill="#f7f9fc"/>
  <text x="800" y="70" text-anchor="middle" fill="#17233b" font-size="40" font-family="Arial,Helvetica,sans-serif" font-weight="800">Trustworthy Embodied Execution: a source-first taxonomy</text>
  <text x="800" y="108" text-anchor="middle" fill="#65748c" font-size="21" font-family="Arial,Helvetica,sans-serif">Classify by why the closed loop becomes untrustworthy — then by where and how we intervene.</text>

  <g>
    <rect x="70" y="155" width="455" height="310" rx="26" fill="url(#g1)" stroke="#ff8b9a"/>
    <text x="105" y="205" fill="#a8233b" font-size="28" font-family="Arial,Helvetica,sans-serif" font-weight="800">I. Malicious Attacks</text>
    <text x="105" y="242" fill="#4d596d" font-size="20" font-family="Arial,Helvetica,sans-serif">Intentional / adversarial source</text>
    <text x="105" y="292" fill="#222d42" font-size="20" font-family="Arial,Helvetica,sans-serif">• visual &amp; physical adversarial inputs</text>
    <text x="105" y="330" fill="#222d42" font-size="20" font-family="Arial,Helvetica,sans-serif">• jailbreak &amp; prompt injection</text>
    <text x="105" y="368" fill="#222d42" font-size="20" font-family="Arial,Helvetica,sans-serif">• WAM / imagination integrity attacks</text>
    <text x="105" y="406" fill="#222d42" font-size="20" font-family="Arial,Helvetica,sans-serif">• red teaming &amp; adversarial evaluation</text>

    <rect x="572" y="155" width="455" height="310" rx="26" fill="url(#g2)" stroke="#efb451"/>
    <text x="607" y="205" fill="#9a6112" font-size="28" font-family="Arial,Helvetica,sans-serif" font-weight="800">II. Soft / Hardware Errors</text>
    <text x="607" y="242" fill="#4d596d" font-size="20" font-family="Arial,Helvetica,sans-serif">Unintentional / system source</text>
    <text x="607" y="292" fill="#222d42" font-size="20" font-family="Arial,Helvetica,sans-serif">• sensor noise &amp; environment shift</text>
    <text x="607" y="330" fill="#222d42" font-size="20" font-family="Arial,Helvetica,sans-serif">• quantization / pruning approximation</text>
    <text x="607" y="368" fill="#222d42" font-size="20" font-family="Arial,Helvetica,sans-serif">• accelerator / memory soft errors</text>
    <text x="607" y="406" fill="#222d42" font-size="20" font-family="Arial,Helvetica,sans-serif">• actuator / joint degradation</text>

    <rect x="1075" y="155" width="455" height="310" rx="26" fill="url(#g3)" stroke="#6cb5ef"/>
    <text x="1110" y="205" fill="#1d67a5" font-size="28" font-family="Arial,Helvetica,sans-serif" font-weight="800">III. Decision Anomalies</text>
    <text x="1110" y="242" fill="#4d596d" font-size="20" font-family="Arial,Helvetica,sans-serif">Internal / model-originated source</text>
    <text x="1110" y="292" fill="#222d42" font-size="20" font-family="Arial,Helvetica,sans-serif">• action oscillation &amp; task drift</text>
    <text x="1110" y="330" fill="#222d42" font-size="20" font-family="Arial,Helvetica,sans-serif">• imagination–reality mismatch</text>
    <text x="1110" y="368" fill="#222d42" font-size="20" font-family="Arial,Helvetica,sans-serif">• long-horizon failure accumulation</text>
    <text x="1110" y="406" fill="#222d42" font-size="20" font-family="Arial,Helvetica,sans-serif">• unsafe but plausible decisions</text>
  </g>

  <text x="800" y="520" text-anchor="middle" fill="#33445f" font-size="23" font-family="Arial,Helvetica,sans-serif" font-weight="700">A common intervention chain across all three sources</text>
  <g font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <rect x="170" y="558" width="250" height="76" rx="20" fill="#ffffff" stroke="#b7c2d3"/><text x="295" y="605" fill="#2b3b55">1 · Detect</text>
    <path d="M430 596h95" stroke="#8d9bb0" stroke-width="4"/><path d="M515 586l16 10-16 10" fill="none" stroke="#8d9bb0" stroke-width="4"/>
    <rect x="540" y="558" width="250" height="76" rx="20" fill="#ffffff" stroke="#b7c2d3"/><text x="665" y="605" fill="#2b3b55">2 · Verify</text>
    <path d="M800 596h95" stroke="#8d9bb0" stroke-width="4"/><path d="M885 586l16 10-16 10" fill="none" stroke="#8d9bb0" stroke-width="4"/>
    <rect x="910" y="558" width="250" height="76" rx="20" fill="#ffffff" stroke="#b7c2d3"/><text x="1035" y="605" fill="#2b3b55">3 · Mitigate</text>
    <path d="M1170 596h95" stroke="#8d9bb0" stroke-width="4"/><path d="M1255 586l16 10-16 10" fill="none" stroke="#8d9bb0" stroke-width="4"/>
    <rect x="1280" y="558" width="250" height="76" rx="20" fill="#ffffff" stroke="#b7c2d3"/><text x="1405" y="605" fill="#2b3b55">4 · Recover</text>
  </g>
</svg>
